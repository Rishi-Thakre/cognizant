<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Partner Banks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f6f9fc;
            color: #2d3748;
        }

        /* Modern Gradient Hero Header */
        .customer-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 80px 0 120px 0;
            position: relative;
            overflow: hidden;
        }

        .customer-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Pill Search Bar */
        .search-box-wrapper {
            max-width: 650px;
            margin: -40px auto 40px auto;
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 50px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
            transform: translateY(-2px);
        }

        .search-box .form-control {
            border: none;
            padding-left: 20px;
            font-size: 1rem;
        }

        .search-box .form-control:focus {
            box-shadow: none;
        }

        .search-box .btn-search {
            border-radius: 50px;
            padding: 12px 28px;
            font-weight: 600;
            background: #2563eb;
            border: none;
            transition: background 0.2s ease;
        }

        .search-box .btn-search:hover {
            background: #1d4ed8;
        }

        /* Sleek Bank Cards instead of Tables */
        .bank-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bank-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            border-color: #bfdbfe;
        }

        .bank-logo-icon {
            width: 48px;
            height: 48px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .bank-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
        }

        .info-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 0.95rem;
            color: #334155;
            font-weight: 500;
        }

        /* Custom Modern Pagination Styling */
        .pagination .page-item .page-link {
            border: 1px solid #e2e8f0;
            color: #475569;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0 3px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .pagination .page-item.active .page-link {
            background-color: #2563eb;
            border-color: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .pagination .page-item .page-link:hover:not(.active) {
            background-color: #ffffff;
            color: #1e293b;
            border-color: #cbd5e1;
        }

        .pagination .page-item.disabled .page-link {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            color: #94a3b8;
        }

        /* Custom Modal Styling */
        .modal-content {
            border-radius: 24px;
            border: none;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            border-bottom: none;
            padding: 24px;
        }

        .modal-body {
            padding: 32px;
        }

        .loan-list-item {
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            font-weight: 500;
            color: #334155;
            border-left: 4px solid #2563eb;
        }
    </style>
</head>

<body>

    <header class="customer-header text-center">
        <div class="container">
            <span class="badge bg-white bg-opacity-10 text-white px-3 py-2 rounded-pill mb-3 text-uppercase fw-semibold tracking-wider" style="letter-spacing: 1px;">Network Ecosystem</span>
            <h1 class="display-5 fw-bold mb-2"><i class="bi bi-shield-check text-info"></i> Our Partner Banks</h1>
            <p class="lead opacity-75 max-w-2xl mx-auto">Instantly connect with our trusted institutional financial partners nearest to you</p>
        </div>
    </header>

    <div class="container mb-5">
        <div class="search-box-wrapper">
            <div class="search-box">
                <div class="input-group">
                    <span class="input-group-text bg-white border-0 py-0"><i class="bi bi-search text-muted fs-5"></i></span>
                    <input type="text" id="bankSearch" class="form-control" placeholder="Search by bank name, location, or code...">
                    <button id="searchBtn" class="btn btn-primary btn-search d-flex align-items-center gap-2">
                        <span>Search</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4" id="bankGrid">
            </div>

        <div id="noResults" class="text-center py-5 d-none">
            <div class="bg-white d-inline-block p-4 rounded-circle shadow-sm mb-3">
                <i class="bi bi-search text-muted display-5"></i>
            </div>
            <h4 class="fw-bold text-secondary">No Partner Banks Found</h4>
            <p class="text-muted">We couldn't find anything matching your exact filter keywords.</p>
        </div>

        <div id="paginationWrapper" class="d-flex flex-column flex-sm-row justify-content-between align-items-center mt-5 pt-3 border-top gap-3">
            <div class="text-muted small fw-medium" id="paginationInfo">
                Showing 0 to 0 of 0 entries
            </div>
            <nav aria-label="Card grid navigation routing">
                <ul class="pagination mb-0" id="paginationControls">
                    </ul>
            </nav>
        </div>
    </div>

    <!-- <div class="modal fade" id="loanModal" tabindex="-1" aria-labelledby="loanModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-white">
                    <h5 class="modal-title fw-bold" id="loanModalLabel"><i class="bi bi-info-circle me-2"></i>Available Offerings</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="loanModalBody">
                        </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light w-100 py-2.5 fw-bold" style="border-radius: 12px;" data-bs-dismiss="modal">Dismiss</button>
                </div>
            </div>
        </div>
    </div> -->

    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->

    <script>
        // Memory Pool configuration container architecture
        let masterBankList = [];
        let filteredBankList = [];
        
        let currentPage = 1;
        const recordsPerPage = 6; // Configured to update every 6 records

        // Generates fallback mock arrays to showcase pagination cleanly if api is unavailable
        function loadMockBackupData() {
            const data = [
                { name: "Global Trust Bank", code: "GTB-9921", location: "Mumbai", phone: "+91 9876543210", address: "Nariman Point, Mumbai, MH" },
                { name: "Urban Finance Co.", code: "UFC-4432", location: "Chennai", phone: "+91 44 2233 4455", address: "Anna Salai, Teynampet, Chennai" }
            ];
            for (let i = 1; i <= 10; i++) {
                data.push({
                    name: `Apex Elite Bank Group ${i}`,
                    code: `AEB-08${i}`,
                    location: i % 2 === 0 ? "Delhi" : "Bangalore",
                    phone: `+91 80554 2210${i}`,
                    address: `Building Plaza Complex Block-${i}, Tech District`
                });
            }
            return data;
        }

        // Central Core Data Render Interface pipeline
        function renderGrid() {
            const gridContainer = document.getElementById("bankGrid");
            gridContainer.innerHTML = "";

            // Evaluate item calculation limits 
            const startIndex = (currentPage - 1) * recordsPerPage;
            const endIndex = Math.min(startIndex + recordsPerPage, filteredBankList.length);
            const activePageSlice = filteredBankList.slice(startIndex, endIndex);

            const noResults = document.getElementById('noResults');
            const paginationWrapper = document.getElementById('paginationWrapper');

            if (filteredBankList.length === 0) {
                noResults.classList.remove('d-none');
                paginationWrapper.classList.add('d-none');
                return;
            } else {
                noResults.classList.add('d-none');
                paginationWrapper.classList.remove('d-none');
            }

            // Loop and draw calculated slice array context
            activePageSlice.forEach((bank, index) => {
                // Alternating color profiles for standard icons styling
                // const isEven = index % 2 === 0;
                // const iconBg = isEven ? '#eff6ff' : '#f0fdf4';
                // const iconColor = isEven ? '#2563eb' : '#16a34a';
                // const badgeClass = isEven ? 'bg-primary text-primary' : 'bg-success text-success';

                gridContainer.innerHTML += `
                <div class="col-md-6 col-lg-4 bank-card-item">
                    <div class="bank-card p-4">
                        <div>
                            <div class="d-flex align-items-center justify-content-between mb-4">
                                <div class="bank-logo-icon" style="background: #eff6ff; color: #2563eb;">
                                    <i class="bi bi-bank"></i>
                                </div>
                                <span class="badge bg-primary text-primary bg-opacity-10 px-2.5 py-1.5 rounded text-xs fw-bold">${bank.code}</span>
                            </div>
                            <h3 class="bank-title mb-3">${bank.name}</h3>
                            
                            <div class="mb-3">
                                <div class="info-label">Location / Hub</div>
                                <div class="info-value"><i class="bi bi-geo-alt text-muted me-1"></i> ${bank.location}</div>
                            </div>
                            
                            <div class="mb-3">
                                <div class="info-label">Contact Line</div>
                                <div class="info-value">
                                    <a href="tel:${bank.phone}" class="text-decoration-none text-reset"><i class="bi bi-telephone text-muted me-1"></i> ${bank.phone || 'N/A'}</a>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="info-label">Operating Address</div>
                                <div class="info-value text-muted small">${bank.address}</div>
                            </div>
                        </div>

                        <button class="btn btn-light text-primary w-100 py-2.5 fw-semibold loan-btn" style="border-radius: 12px;">
                            <i class="bi bi-wallet2 me-1"></i> View Loans
                        </button>
                    </div>
                </div>`;
            });

            updatePaginationControls(startIndex, endIndex);
        }

        // Bottom pagination interactive structural mapping engine
        function updatePaginationControls(start, end) {
            const totalPages = Math.ceil(filteredBankList.length / recordsPerPage);
            const infoText = document.getElementById('paginationInfo');
            const controlsContainer = document.getElementById('paginationControls');

            infoText.innerText = filteredBankList.length > 0 
                ? `Showing ${start + 1} to ${end} of ${filteredBankList.length} entries`
                : `Showing 0 to 0 of 0 entries`;

            controlsContainer.innerHTML = "";

            if (totalPages <= 1) return; // Suppress control array visualization if data fits on page 1 completely

            // Left Previous Chevron Item link logic
            controlsContainer.innerHTML += `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1})"><i class="bi bi-chevron-left"></i></a>
                </li>
            `;

            // Sequential explicit page indexes distribution logic loop mapping
            for (let i = 1; i <= totalPages; i++) {
                controlsContainer.innerHTML += `
                    <li class="page-item ${currentPage === i ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                    </li>
                `;
            }

            // Right Next Chevron Item link logic
            controlsContainer.innerHTML += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1})"><i class="bi bi-chevron-right"></i></a>
                </li>
            `;
        }

        function changePage(pageNumber) {
            event.preventDefault();
            currentPage = pageNumber;
            renderGrid();
            // Fluid window viewport scroll reset action
            window.scrollTo({ top: document.getElementById('bankSearch').offsetTop - 40, behavior: 'smooth' });
        }

        // Integrated filtering framework processing engine 
        function runSearchFilter() {
            const query = document.getElementById('bankSearch').value.toLowerCase().trim();
            
            filteredBankList = masterBankList.filter(bank => {
                return bank.name.toLowerCase().includes(query) || 
                       bank.location.toLowerCase().includes(query) || 
                       bank.code.toLowerCase().includes(query);
            });

            currentPage = 1; // Always jump back to Page 1 when filter constraints change
            renderGrid();
        }

        document.getElementById('bankSearch').addEventListener('keyup', runSearchFilter);
        document.getElementById('searchBtn').addEventListener('click', runSearchFilter);

        // Click handler inside Dynamic Grid Matrix for modal actions
        document.getElementById('bankGrid').addEventListener('click', function(e) {
            const loanBtn = e.target.closest('.loan-btn');
            if (loanBtn) {
                const cardElement = loanBtn.closest('.bank-card');
                const bankName = cardElement.querySelector('.bank-title').innerText;
                const modalBody = document.getElementById('loanModalBody');
                
                modalBody.innerHTML = `
                    <p class="mb-4 text-muted">Explore customized options structured by <span class="text-dark fw-bold">${bankName}</span>:</p>
                    <div class="loan-list-item"><i class="bi bi-house-heart text-primary me-3 fs-5"></i> Home Loan — Competitive fixed rates</div>
                    <div class="loan-list-item"><i class="bi bi-person-badge text-primary me-3 fs-5"></i> Personal Loan — Instant digital sign-off</div>
                    <div class="loan-list-item"><i class="bi bi-car-front text-primary me-3 fs-5"></i> Auto Loan — Flexible payment structures</div>
                    <div class="loan-list-item"><i class="bi bi-briefcase text-primary me-3 fs-5"></i> Enterprise Loan — Custom working frameworks</div>
                `;
                const loanModal = new bootstrap.Modal(document.getElementById('loanModal'));
                loanModal.show();
            }
        });

        // Dynamic API initialization lifecycles
        fetch("/getAllBanks")
        .then(response => {
            if (!response.ok) throw new Error("Fallback execution routing triggered");
            return response.json();
        })
        .then(data => {
            // Unpacks properties into flat architecture maps safely matching object models
            masterBankList = data.map(bank => ({
                name: typeof bank.getBankName === 'function' ? bank.getBankName() : bank.name,
                code: typeof bank.getBranchCode === 'function' ? bank.getBranchCode() : bank.code,
                location: typeof bank.getLocation === 'function' ? bank.getLocation() : bank.location,
                phone: typeof bank.getContactNumber === 'function' ? bank.getContactNumber() : bank.phone,
                address: typeof bank.getBranchAddress === 'function' ? bank.getBranchAddress() : bank.address
            }));
            filteredBankList = [...masterBankList];
            renderGrid();
        })
        .catch(error => {
            console.warn("Using mock operational backup framework instances strategy rules:", error);
            masterBankList = loadMockBackupData();
            filteredBankList = [...masterBankList];
            renderGrid();
        });
    </script>
</body>

</html>
